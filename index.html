<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Top Gospel FM">
<title>Top Gospel FM</title>
<link rel="apple-touch-icon" href="IMG_8290.jpeg">
<style>
:root{--gold:#f6b81e;--gold2:#e8891c;--blue:#1b6fd8;--mut:#9aa4b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(70% 45% at 50% 38%,rgba(27,111,216,.38),transparent 70%),radial-gradient(60% 30% at 50% 100%,rgba(246,184,30,.14),transparent 70%),#000}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 18px)}
header{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.2px}
header span{display:flex;align-items:center;gap:8px;font-size:15px}
header svg{width:20px;height:20px;fill:var(--gold)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.live i{width:8px;height:8px;border-radius:50%;background:#777}
body.on .live i{background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:18px;min-height:0}
.logo{width:min(82vw,380px);max-height:44vh;object-fit:contain;filter:drop-shadow(0 0 40px rgba(27,111,216,.45));transition:transform .6s}
body.on .logo{transform:scale(1.03)}
.eq{display:flex;gap:5px;align-items:flex-end;height:30px}
.eq b{width:5px;height:6px;border-radius:3px;background:linear-gradient(var(--gold),var(--gold2));transition:height .3s}
body.on .eq b{animation:eq 1s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.15s!important}.eq b:nth-child(3){animation-delay:.3s!important}.eq b:nth-child(4){animation-delay:.45s!important}.eq b:nth-child(5){animation-delay:.1s!important}.eq b:nth-child(6){animation-delay:.35s!important}.eq b:nth-child(7){animation-delay:.2s!important}
@keyframes eq{0%,100%{height:6px}50%{height:30px}}
.info{text-align:center}
.info h1{margin:0;font-size:22px}
#s{margin:4px 0 0;font-size:14px;color:var(--mut);min-height:1.3em}
.ctrl{width:100%;display:flex;flex-direction:column;align-items:center;gap:26px}
#b{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#111;display:grid;place-items:center;box-shadow:0 8px 30px rgba(246,184,30,.35);transition:transform .15s}
#b:active{transform:scale(.93)}
#b:focus-visible,#v:focus-visible,.sh:focus-visible{outline:3px solid #fff;outline-offset:4px}
#b svg{width:44px;height:44px;fill:currentColor}
.pause,.load{display:none}
body.on .play{display:none}body.on .pause{display:block}
body.wait .pause{display:none}body.wait .load{display:block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vol{width:100%;display:flex;align-items:center;gap:12px;color:var(--mut)}
.vol svg{width:20px;height:20px;fill:currentColor;flex:none}
#v{flex:1;accent-color:var(--gold);height:28px}
.sh{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:6px 10px}
@media (prefers-reduced-motion:reduce){body.on .eq b,body.wait .load{animation:none}.eq b{height:16px!important}}
</style></head><body>
<div class="bg"></div>
<div class="app">
 <header>
  <span><svg viewBox="0 0 24 24"><path d="M12 11a2 2 0 100 4 2 2 0 000-4zm-4.2 6.8a6 6 0 010-8.5l1.2 1.2a4.3 4.3 0 000 6.1zm8.4 0l-1.2-1.2a4.3 4.3 0 000-6.1l1.2-1.2a6 6 0 010 8.5zM5 20.6a10 10 0 010-15.2l1.2 1.2a8.3 8.3 0 000 12.8zm14 0l-1.2-1.2a8.3 8.3 0 000-12.8L19 5.4a10 10 0 010 15.2z" transform="translate(0 -1)"/></svg>Top Gospel FM</span>
  <div class="live"><i></i><em id="lt" style="font-style:normal">AO VIVO</em></div>
 </header>
 <main class="stage">
  <img class="logo" alt="Top Gospel FM" src="IMG_8290.jpeg">
  <div class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
  <div class="info"><h1>Top Gospel FM</h1><p id="s" role="status">Toque para ouvir</p></div>
 </main>
 <div class="ctrl">
  <button id="b" aria-label="Tocar">
   <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
   <svg class="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
   <svg class="load" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9h-3a6 6 0 11-6-6z"/></svg>
  </button>
  <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/></svg><input id="v" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg></div>
  <button class="sh" id="sh">Compartilhar a rádio</button>
 </div>
</div>
<audio id="a" preload="none" playsinline></audio>
<script>
const SRC="https://stream.zeno.fm/auuybflmohvuv";
const a=document.getElementById('a'),b=document.getElementById('b'),s=document.getElementById('s'),v=document.getElementById('v'),lt=document.getElementById('lt'),B=document.body;
let want=false,retry=0,timer;
function st(m){B.classList.remove('on','wait');if(m)B.classList.add(m)}
function start(){
  want=true;clearTimeout(timer);st('wait');s.textContent='Conectando...';
  a.src=SRC+(SRC.includes('?')?'&':'?')+'t='+Date.now();
  a.play().catch(e=>{if(e&&e.name==='NotAllowedError'){want=false;st();s.textContent='Toque para ouvir'}else fail()});
}
function stop(){want=false;retry=0;clearTimeout(timer);a.pause();a.removeAttribute('src');a.load();st();s.textContent='Pausado';b.setAttribute('aria-label','Tocar');lt.textContent='AO VIVO'}
function fail(){
  if(!want)return;
  if(retry<5){retry++;st('wait');s.textContent='Reconectando...';timer=setTimeout(start,1500*retry)}
  else{want=false;retry=0;st();s.textContent='Sem sinal. Toque para tentar de novo.'}
}
b.onclick=()=>want?stop():start();
a.onplaying=()=>{retry=0;st('on');s.textContent='Tocando agora';b.setAttribute('aria-label','Pausar')};
a.onwaiting=()=>{if(want){st('wait');s.textContent='Carregando...'}};
a.onstalled=()=>{if(want)timer=setTimeout(()=>{if(want&&a.readyState<3)start()},8000)};
a.onerror=()=>{if(a.getAttribute('src'))fail()};
a.onended=()=>{if(want)start()};
v.oninput=()=>{a.volume=v.value};
document.getElementById('sh').onclick=async()=>{
  const d={title:'Top Gospel FM',text:'Ouça a Top Gospel FM ao vivo!',url:location.href};
  try{navigator.share?await navigator.share(d):(await navigator.clipboard.writeText(d.url),s.textContent='Link copiado')}catch(e){}
};
if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:'Ao vivo',artist:'Top Gospel FM',album:'Top Gospel FM',artwork:[{src:'IMG_8290.jpeg',sizes:'512x512',type:'image/jpeg'}]});
  navigator.mediaSession.setActionHandler('play',()=>{if(!want)start()});
  navigator.mediaSession.setActionHandler('pause',()=>{if(want)stop()});
  navigator.mediaSession.setActionHandler('stop',()=>{if(want)stop()});
}
</script></body></html>
